[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "documentcrawler"
version = "0.2.0"
description = "CLI and desktop GUI to find and download academic papers and books from open-access and shadow-library sources."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "documentcrawler contributors" }]
keywords = ["scraper", "papers", "doi", "research", "academic", "bibliography", "bibtex", "open-access", "unpaywall", "arxiv", "gui", "tkinter"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Environment :: MacOS X",
    "Environment :: Win32 (MS Windows)",
    "Environment :: X11 Applications",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Internet :: WWW/HTTP",
    "Topic :: Scientific/Engineering",
]
dependencies = [
    "typer>=0.12",
    "rich>=13.7",
    "httpx[http2]>=0.27",
    "tenacity>=8.2",
    "pydantic>=2.6",
    "selectolax>=0.3.21",
    "beautifulsoup4>=4.12",
    "bibtexparser>=1.4",
    "rispy>=0.9",
    "python-slugify>=8.0",
    "rapidfuzz>=3.6",
]

[project.optional-dependencies]
browser = ["playwright>=1.44"]
serve = ["fastapi>=0.110", "uvicorn>=0.29"]
gui = ["documentcrawler[browser]"]
full = ["documentcrawler[browser,serve]"]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-httpx>=0.30",
    "ruff>=0.4",
]

[project.scripts]
documentcrawler = "documentcrawler.cli:_main"

[project.urls]
Homepage = "https://github.com/mpdecker/DogTheLibrarian"
"Bug Tracker" = "https://github.com/mpdecker/DogTheLibrarian/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/documentcrawler"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "N", "SIM"]
ignore = ["E501", "UP042"]

[tool.ruff.lint.per-file-ignores]
# Typer's idiomatic pattern uses callable defaults for Option / Argument.
"src/documentcrawler/cli.py" = ["B008"]
# Searcher modules are imported only for their @register side-effects, in a
# specific (alphabetical) order. Splitting them off triggers I001 spuriously.
"src/documentcrawler/searcher/__init__.py" = ["I001"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
markers = [
    "e2e: end-to-end tests that require network access",
    "asyncio: async tests",
    "httpx_mock: tests that mock HTTPX responses",
]
filterwarnings = [
    "ignore:.*StarletteDeprecationWarning.*",
]
